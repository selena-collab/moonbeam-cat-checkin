<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon Beam Cat Check-In</title>
<style>
  :root { --ink:#1B2A4A; --gold:#B8956A; --cream:#FFF8EE; --card:#fff; --line:#E7D7C3; --soft:#F3E7D6; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--cream); color:var(--ink); font-family: Georgia, "Iowan Old Style", serif; }
  body { min-height:100vh; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  header img { width:100%; border-radius: 18px; display:block; }
  h1 { font-size: 1.8rem; letter-spacing: .04em; margin: 14px 0 4px; text-align:center; }
  .sub { text-align:center; color:#6B6256; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius: 18px; padding: 18px; margin-top: 14px; }
  p { line-height: 1.5; font-size: 1.12rem; }
  button, .choice { font-family: Georgia, serif; font-size: 1.08rem; }
  button { background: var(--ink); color: white; border:0; border-radius: 999px; padding: 14px 18px; min-height: 48px; width:100%; cursor:pointer; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); margin-top: 8px; }
  button:focus, .choice:focus, textarea:focus, input:focus { outline: 3px solid #E4C98A; outline-offset: 2px; }
  .row { display:flex; gap:8px; }
  .row button { width:auto; flex:1; }
  .progress { height: 10px; background: var(--soft); border-radius: 99px; overflow:hidden; margin: 8px 0 4px; }
  .bar { height:100%; width:0; background: var(--gold); }
  .meta { color:#6B6256; font-size: .95rem; text-align:center; }
  .passage { background: var(--soft); border-radius: 14px; padding: 12px 14px; }
  .choice { display:block; width:100%; text-align:left; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius: 14px; padding: 14px; margin: 8px 0; min-height: 48px; cursor:pointer; }
  .choice.picked { border-color: var(--ink); background: #F7F1E6; }
  textarea, input[type=text] { width:100%; border:1px solid var(--line); border-radius: 12px; padding: 12px; font: 1.05rem Georgia, serif; }
  textarea { min-height: 140px; }
  .break { position: fixed; right: 12px; bottom: 12px; width: auto; padding: 12px 16px; background:#fff; color:var(--ink); border:1px solid var(--line); }
  .hide { display:none; }
  ul { padding-left: 18px; }
  li { margin: 8px 0; line-height: 1.45; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

  if(step < 0){
    app.innerHTML = `<div class="card">
      <p>Hi. I'm Pip. This is a check-in, not a grade. There is no timer. You can skip any question. You can take a cat break whenever you want.</p>
      <p>Your name, if you want it on the results:</p>
      <input id="name" type="text" autocomplete="name" placeholder="Name">
      <div style="height:12px"></div>
      <button id="start" type="button">Start with Pip</button>
    </div>`;
    document.getElementById("start").onclick = () => { answers.name = document.getElementById("name").value.trim(); step = 0; render(); };
    return;
  }
  if(step >= questions.length){ return results(); }
  const q = questions[step];
  const picked = answers[q.id];
  const choices = (q.choices||[]).map((c,i)=>`<button class="choice ${picked===i?'picked':''}" data-i="${i}" type="button">${esc(c)}</button>`).join("");
  app.innerHTML = `<div class="progress" aria-hidden="true"><div class="bar" style="width:${Math.round(step/questions.length*100)}%"></div></div>
    <p class="meta">Part ${step+1} of ${questions.length} · ${esc(q.part)}</p>
    <div class="card">
      ${q.passage?`<div class="passage"><p>${esc(q.passage)}</p></div>`:""}
      <p><strong>${esc(q.prompt)}</strong></p>
      ${q.kind==="write" ? `<textarea id="write" placeholder="A few sentences is perfect.">${esc(answers[q.id]||"")}</textarea>` : choices}
      <div class="row" style="margin-top:12px">
        <button class="ghost" id="skip" type="button">Skip</button>
        <button id="next" type="button">${step===questions.length-1?"See my plan":"Next"}</button>
      </div>
    </div>`;
  document.querySelectorAll(".choice").forEach(b => b.onclick = () => { answers[q.id] = Number(b.dataset.i); render(); });
  document.getElementById("skip").onclick = () => { step++; render(); };
  document.getElementById("next").onclick = () => {
    if(q.kind==="write") answers[q.id] = document.getElementById("write").value.trim();
    step++; render();
  };
}
function band(score, total){
  if(score <= 1) return "starting";
  if(score <= 3) return "building";
  return "ready";
}
function results(){
  let reading = 0, math = 0, rMax = 0, mMax = 0;
  questions.forEach(q => {
    if(q.scored===false || q.kind==="write") return;
    if(q.skill==="reading"){ rMax++; if(answers[q.id]===q.answer) reading++; }
    if(q.skill==="math"){ mMax++; if(answers[q.id]===q.answer) math++; }
  });
  const rb = band(reading, rMax), mb = band(math, mMax);
  const plans = {
    reading: {
      starting: "Start with a short cat story, about half a page. After reading, answer 3 questions out loud or in a sentence: who, what happened, and one new word. One story, three days a week.",
      building: "Read a one-page cat story. Write the main idea in one sentence, then one detail that proves it. Add 5 vocabulary words from the story to a cat-word list.",
      ready: "Read a short article or a chapter. Write a 5-sentence response: what happened, what the character wanted, and whether you agree. Keep a word list of 8 new words."
    },
    math: {
      starting: "Ten-minute practice: adding and subtracting within 20, then halves and quarters with cat treats. Use objects. Three short sets a week, not a long worksheet.",
      building: "Practice fractions of a group, negatives on a number line, and one-step equations like x + 5 = 12. Eight problems a session, then stop.",
      ready: "Grade 9 start: integers, percents, and two-step equations. A 10-problem set, plus one word problem she explains in words."
    }
  };
  const time = answers.p1!=null ? questions.find(q=>q.id==="p1").choices[answers.p1] : "not answered";
  const start = answers.p2!=null ? questions.find(q=>q.id==="p2").choices[answers.p2] : "not answered";
  const writing = answers.w1 || "(no writing yet)";
  const name = answers.name || "Student";
  const summary = `${name} — Moon Beam Cat Check-In
Reading: ${reading}/${rMax} (${rb})
Math: ${math}/${mMax} (${mb})
Homework length that feels okay: ${time}
What helps starting: ${start}
Writing sample:
${writing}
Homework to assign:
Reading — ${plans.reading[rb]}
Math — ${plans.math[mb]}`;
  app.innerHTML = `<div class="card">
    <h2>Pip's plan for ${esc(name)}</h2>
    <p>Reading: ${reading} of ${rMax}. Math: ${math} of ${mMax}. This shows a starting place, not a grade.</p>
    <p><strong>Reading homework</strong></p><p>${esc(plans.reading[rb])}</p>
    <p><strong>Math homework</strong></p><p>${esc(plans.math[mb])}</p>
    <p><strong>How to assign it</strong></p>
    <ul>
      <li>Keep each piece near this length: ${esc(time)}.</li>
      <li>To help starting: ${esc(start)}.</li>
      <li>Same order every time: read, math, cat break, done.</li>
    </ul>
    <p><strong>Writing sample</strong></p><p>${esc(writing)}</p>
    <button id="copy" type="button">Copy results to send back</button>
    <button class="ghost" id="again" type="button">Start over</button>
    <p class="meta" id="copied"></p>
  </div>`;
  document.getElementById("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(summary); document.getElementById("copied").textContent = "Copied. You can paste it in a text to Selena."; }
    catch(e){ document.getElementById("copied").textContent = summary; }
  };
  document.getElementById("again").onclick = () => { step = -1; Object.keys(answers).forEach(k => delete answers[k]); render(); };
}
breakBtn.onclick = () => { onBreak = !onBreak; render(); };
render();
</script>
